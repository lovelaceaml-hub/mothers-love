name: Mother's Love color polish verification

on:
  push:
    branches: [codex/mothers-love-color-polish]
    paths:
      - .github/workflows/color-polish-release.yml
      - scripts/review/mothers-love-color-polish.patch.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mothers-love-color-polish
  cancel-in-progress: true

jobs:
  verify-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_TELEMETRY_DISABLED: 1
      npm_config_cache: /tmp/npm-cache
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      DISPLAY_SCREENSHOTS: 1
      DISPLAY_SCREENSHOT_DIR: ${{ github.workspace }}/color-polish-evidence/tv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed color polish patch
        run: |
          base64 -d scripts/review/mothers-love-color-polish.patch.b64 | gzip -dc > /tmp/mothers-love-color-polish.patch
          if grep -q "Mother’s Love TV color & visual polish pass" src/components/display/DisplayExperience.module.css; then
            echo "Color polish already applied."
          else
            patch -p1 --batch < /tmp/mothers-love-color-polish.patch
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Type check and lint
        run: npm run typecheck && npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build without production credentials
        run: npm run build

      - name: Install Chromium and start isolated application
        run: |
          npx playwright install --with-deps chromium
          mkdir -p color-polish-evidence/tv home-review-evidence mobile-recognition-evidence
          npm run start -- --hostname 127.0.0.1 --port 3100 > color-polish-evidence/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null

      - name: Home, submission, and TV browser verification
        run: |
          npx playwright test \
            tests/feed \
            tests/submission \
            tests/mobile-recognition \
            tests/display/display.e2e.spec.ts \
            --workers=2 --retries=0 --reporter=line

      - name: Save verified visual-only implementation to review branch
        run: |
          git add -- \
            src/lib/catalog.ts \
            src/components/feed/FeedHome.tsx \
            src/components/feed/HomeExperience.module.css \
            src/components/campaign/ExpressionDrift.module.css \
            src/components/submission/SubmissionExperience.module.css \
            src/components/display/DisplayExperience.module.css \
            src/components/display/garden/Garden.module.css \
            src/components/display/insights/DisplayInsights.module.css \
            src/components/display/teaching/TeachingScreens.module.css
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply Mother’s Love color and visual polish across public and TV views'
            git push origin HEAD:refs/heads/codex/mothers-love-color-polish
          fi
          git rev-parse HEAD > color-polish-evidence/verified-commit.txt
          git status --short > color-polish-evidence/worktree-status.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mothers-love-color-polish-review
          retention-days: 3
          path: |
            color-polish-evidence/
            home-review-evidence/
            mobile-recognition-evidence/
            test-results/
