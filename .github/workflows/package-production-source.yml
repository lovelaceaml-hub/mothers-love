name: Package production source

on:
  push:
    branches: [codex/mothers-love-color-polish]
    paths:
      - .github/workflows/package-production-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved color polish
        run: |
          base64 -d scripts/review/mothers-love-color-polish.patch.b64 | gzip -dc > /tmp/mothers-love-color-polish.patch
          patch -p1 --batch < /tmp/mothers-love-color-polish.patch
      - name: Archive patched production source
        run: tar --exclude=.git --exclude=deploy-source.tar -cf deploy-source.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: mothers-love-production-source
          retention-days: 1
          path: deploy-source.tar
